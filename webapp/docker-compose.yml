# KSU Engineering Alumni — full stack
#
#   docker compose up --build
#
#   web    http://localhost:3000
#   minio  http://localhost:9001   (console; credentials from .env)
#   db     localhost:5432
#   mail   http://localhost:8025   (Mailpit — development mail catcher)
#
# The MinIO bucket is created by the web app on first use
# (src/lib/server/storage.ts → ensureBucket), so no init container is needed.
#
# Secrets come from .env (copy .env.example). The defaults there are for
# local development only — rotate everything before any shared deployment.

services:
  db:
    image: postgres:16-alpine
    container_name: ksu-alumni-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alumni}
      POSTGRES_USER: ${POSTGRES_USER:-alumni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alumni_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema + seed run once, on first start of an empty volume.
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alumni} -d ${POSTGRES_DB:-alumni}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: ksu-alumni-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
      # The healthcheck's `mc ready local` reads its alias from here, so it
      # cannot be broken by editing mc's config inside the container.
      MC_HOST_local: http://localhost:9000
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ksu-en-alumni:latest
    container_name: ksu-en-alumni
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-alumni}:${POSTGRES_PASSWORD:-alumni_dev_only}@db:5432/${POSTGRES_DB:-alumni}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
      MINIO_BUCKET: ${MINIO_BUCKET:-alumni-files}
      POLICY_VERSION: ${POLICY_VERSION:-2569-10-30}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      APP_SECRET: ${APP_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      CRON_SECRET: ${CRON_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_MESSAGING_ACCESS_TOKEN: ${LINE_MESSAGING_ACCESS_TOKEN:-}
      DEMO_SEED_MEDIA: ${DEMO_SEED_MEDIA:-false}
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  # FR-NOTI: delivery and scheduled tasks. Reuses the web image, so nothing
  # extra to pull; it only calls the app's internal endpoint once a minute.
  cron:
    image: ksu-en-alumni:latest
    container_name: ksu-alumni-cron
    depends_on:
      web:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    # The web image's HEALTHCHECK probes a server this container does not run.
    healthcheck:
      disable: true
    entrypoint: ["node", "-e"]
    command:
      - |
        const tick = async () => {
          try {
            const r = await fetch("http://web:3000/api/internal/cron", { method: "POST", headers: { "x-cron-secret": process.env.CRON_SECRET || "" } });
            const t = await r.text();
            if (!r.ok || t.includes("error")) console.log(new Date().toISOString(), r.status, t.slice(0, 300));
          } catch (e) { console.log(new Date().toISOString(), "cron call failed:", e.message); }
        };
        tick(); setInterval(tick, 60000);
    restart: unless-stopped

  # Development mail catcher: every email the app sends lands here.
  # Web UI: http://localhost:${MAILPIT_UI_PORT:-8025}. Replace with real SMTP in production.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ksu-alumni-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  # NFR-SEC-05: nightly database dump (verified, newest BACKUP_KEEP kept)
  # and a mirror of the file bucket, both into ./backups — which holds
  # personal data, is git-ignored, and should be copied off this machine.
  # Restore drill: sh scripts/restore-test.sh
  backup:
    image: postgres:16-alpine
    container_name: ksu-alumni-backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-alumni}
      PGPASSWORD: ${POSTGRES_PASSWORD:-alumni_dev_only}
      PGDATABASE: ${POSTGRES_DB:-alumni}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    restart: unless-stopped

  backup-files:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: ksu-alumni-backup-files
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_src: http://${MINIO_ROOT_USER:-minioadmin}:${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}@minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-alumni-files}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-files.sh:/backup-files.sh:ro
    entrypoint: ["sh", "/backup-files.sh"]
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
