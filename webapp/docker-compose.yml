# KSU Engineering Alumni — full stack
#
#   docker compose up --build
#
#   web    http://localhost:3000
#   minio  http://localhost:9001   (console; credentials from .env)
#   db     localhost:5432
#
# The MinIO bucket is created by the web app on first use
# (src/lib/server/storage.ts → ensureBucket), so no init container is needed.
#
# Secrets come from .env (copy .env.example). The defaults there are for
# local development only — rotate everything before any shared deployment.

services:
  db:
    image: postgres:16-alpine
    container_name: ksu-alumni-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alumni}
      POSTGRES_USER: ${POSTGRES_USER:-alumni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alumni_dev_only}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema + seed run once, on first start of an empty volume.
      - ./db:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alumni} -d ${POSTGRES_DB:-alumni}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: ksu-alumni-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
    volumes:
      - miniodata:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ksu-en-alumni:latest
    container_name: ksu-en-alumni
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgres://${POSTGRES_USER:-alumni}:${POSTGRES_PASSWORD:-alumni_dev_only}@db:5432/${POSTGRES_DB:-alumni}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_dev_only}
      MINIO_BUCKET: ${MINIO_BUCKET:-alumni-files}
      # Public hostname used in presigned URLs handed to the browser.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      MINIO_PUBLIC_PORT: ${MINIO_API_PORT:-9000}
      POLICY_VERSION: ${POLICY_VERSION:-2569-10-30}
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
