# alumni.iaaaiksu.com -> KSU Engineering Alumni (Next.js in docker, /root/ksu-alumni/webapp)
#   /  -> ksu-en-alumni container (127.0.0.1:3200)
#
# Install:  cp deploy/nginx/alumni.iaaaiksu.com.conf /etc/nginx/sites-available/alumni.iaaaiksu.com
#           ln -s ../sites-available/alumni.iaaaiksu.com /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
#           certbot --nginx -d alumni.iaaaiksu.com     (adds the 443 block + redirect)

upstream ksu_alumni_web { server 127.0.0.1:3200; }

server {
    listen 80;
    listen [::]:80;
    server_name alumni.iaaaiksu.com;

    access_log /var/log/nginx/alumni.access.log;
    error_log  /var/log/nginx/alumni.error.log;

    # Matches serverActions.bodySizeLimit in next.config.ts (admin image uploads).
    client_max_body_size 10m;

    location / {
        proxy_pass http://ksu_alumni_web;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite, never append: src/lib/server/client-ip.ts trusts the
        # left-most entry, so a client-supplied header must not survive.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1100;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml
               image/svg+xml;
}
